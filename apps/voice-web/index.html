<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Voice Bridge</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #111827; color: #f9fafb; }
      .wrap { max-width: 760px; margin: 0 auto; }
      button { font-size: 18px; padding: 16px 20px; border-radius: 12px; border: 0; cursor: pointer; }
      #ptt { background: #22c55e; color: #06210f; font-weight: 700; width: 100%; }
      #ptt.recording { background: #ef4444; color: white; }
      .card { background: #1f2937; padding: 16px; border-radius: 16px; margin-top: 16px; }
      .label { font-size: 12px; text-transform: uppercase; opacity: 0.7; margin-bottom: 8px; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
      #status { margin-top: 12px; opacity: 0.85; }
      audio { width: 100%; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>OpenClaw Voice Bridge</h1>
      <p>Push-to-talk MVP over Tailscale.</p>
      <button id="ptt">Hold to talk</button>
      <div id="status">Idle.</div>
      <div class="card">
        <div class="label">Transcript</div>
        <pre id="transcript">—</pre>
      </div>
      <div class="card">
        <div class="label">Reply</div>
        <pre id="reply">—</pre>
        <audio id="player" controls></audio>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
